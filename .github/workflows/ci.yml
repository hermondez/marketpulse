# CI en cada Pull Request: calidad de código + tests + dbt build en un esquema aislado.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e . --no-deps
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Pytest
        run: pytest -q

  dbt:
    runs-on: ubuntu-latest
    needs: python
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_WAREHOUSE: MARKETPULSE_WH
      SNOWFLAKE_DATABASE: MARKETPULSE
      DBT_TARGET: dev
      # Esquema efímero por PR: CI_PR_42_MARTS, etc. No pisa dev ni prod.
      DBT_SCHEMA_PREFIX: CI_PR_${{ github.event.pull_request.number || 'MANUAL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install dbt-core==1.8.8 dbt-snowflake==1.8.4
      - name: Perfil dbt desde plantilla (credenciales vía env/secrets)
        run: cp dbt/profiles.example.yml dbt/profiles.yml
      - name: dbt parse (no necesita conexión)
        working-directory: dbt
        run: dbt parse --profiles-dir .
      - name: dbt build en esquema CI
        # Forks no reciben secrets: en ese caso solo validamos con parse.
        if: ${{ env.SNOWFLAKE_ACCOUNT != '' }}
        working-directory: dbt
        run: dbt build --profiles-dir . --full-refresh
      - name: Limpiar esquemas CI
        if: ${{ always() && env.SNOWFLAKE_ACCOUNT != '' }}
        working-directory: dbt
        run: |
          for s in STAGING INTERMEDIATE MARTS SEEDS SNAPSHOTS; do
            dbt run-operation --profiles-dir . drop_schema_if_exists --args "{schema: ${DBT_SCHEMA_PREFIX}_$s}" || true
          done
