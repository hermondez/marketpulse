# Reglas de alertas (Módulo 2). Todas informativas, nunca recomiendan comprar/vender.
daily_move:
  enabled: true
  threshold_pct: 2.0        # |retorno diario| > 2 %
sma200_cross:
  enabled: true             # cruce del precio por encima/debajo de la SMA 200
rsi_extreme:
  enabled: true
  high: 70
  low: 30
near_52w_low:
  enabled: true
  within_pct: 3.0           # a menos de 3 % del mínimo de 52 semanas
daily_summary:
  enabled: true
# Tickers "spotlight": sección extra solo en el resumen diario (p. ej. una empresa que quieras seguir).
# NO entran en la watchlist, dashboard, portafolio, seeds ni reglas; no se guardan en Snowflake.
spotlight: [IBM]
health:
  max_staleness_days: 4     # tolera fin de semana largo / feriado
  min_rows_per_day: 5       # chequeo de volumen: al menos N tickers cargados
