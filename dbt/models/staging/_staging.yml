version: 2
models:
  - name: stg_prices_daily
    description: Precios diarios limpios, una fila por ticker y día.
    data_tests:
      - unique_combination_of_columns:
          combination_of_columns: [ticker, trade_date]
    columns:
      - name: ticker
        data_tests: [not_null]
      - name: trade_date
        data_tests: [not_null, not_in_future]
      - name: close
        data_tests:
          - not_null
          - is_between: {min_value: 0.0001, max_value: 1000000}
      - name: volume
        data_tests:
          - is_between: {min_value: 0, max_value: 100000000000}
  - name: stg_dividends
    description: Dividendos por acción en su fecha ex.
    data_tests:
      - unique_combination_of_columns:
          combination_of_columns: [ticker, ex_date]
