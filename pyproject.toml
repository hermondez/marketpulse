# Empaquetado del proyecto con layout src/ (ver docs/src_layout.md).
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpulse"
version = "0.1.0"
description = "Herramienta educativa: tracker de mercado, alertas, salud del pipeline y preguntas en lenguaje natural sobre datos públicos."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
# Dependencias núcleo (ingesta, alertas, health, seguridad SQL). Versiones fijadas
# igual que en requirements.txt para builds reproducibles.
dependencies = [
  "pandas==2.2.3",
  "pyyaml==6.0.2",
  "requests==2.32.3",
  "tenacity==9.0.0",
  "python-dotenv==1.0.1",
  "sqlglot==25.24.5",
  "exchange_calendars==4.5.6",
  "yfinance==0.2.66",
  "curl_cffi==0.13.0",  # >=0.14 exige cffi>=2, choca con snowflake-connector 3.x
  "snowflake-connector-python[pandas]==3.12.2",
]

[project.optional-dependencies]
dashboard = ["streamlit==1.39.0", "plotly==5.24.1"]
dbt = ["dbt-core==1.8.8", "dbt-snowflake==1.8.4"]
dev = ["ruff==0.6.9", "pytest==8.3.3"]

[project.scripts]
mp-ingest = "marketpulse.ingestion.run_ingestion:main"
mp-alerts = "marketpulse.alerts.run_alerts:main"
mp-health = "marketpulse.health.run_health:main"
mp-bot = "marketpulse.alerts.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
